<head>

  <title>text-size-adjust テスト（完全版）</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 20px;
    }

	  /* 默认竖屏样式：按钮居中或底部 */
.container {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
}

/* 监听 iPhone 横屏旋转 */
@media screen and (orientation: landscape) {
  .container {
    /* 改变主轴方向为水平，并将内容两端对齐 */
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
  }
  
  .my-button {
    /* 将按钮移动到最右侧 */
    margin-left: auto; 
  }
}
	  
    .box {
      margin-bottom: 30px;
      padding: 15px;
      border: 1px solid #ccc;
    }

    /* ❌ 自動調整なし */
    .none {
      -webkit-text-size-adjust: none;
      text-size-adjust: none;
    }

    /* ✅ 推奨 */
    .normal {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    /* ⚠️ デフォルト動作 */
    .auto {
      -webkit-text-size-adjust: auto;
      text-size-adjust: auto;
    }

    .title {
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .content {
      font-size: 100px;
      line-height: 5.6;
    }
  </style>
</head>

<body>
<script>
  var bodyTag;
var executionTime = new Date().getTime(); // JavaScript execution time

// Document ready
//----------------
documentReady(function() {
	// Don't hide address bar after a distracting amount of time
	var readyTime = new Date().getTime()
	if((readyTime - executionTime) < 3000) hideAddressBar(true);

});

// Run specified function when document is ready (HTML5)
//------------------------------------------------------
function documentReady(readyFunction) {
	document.addEventListener('DOMContentLoaded', function() {
		document.removeEventListener('DOMContentLoaded', arguments.callee, false);
		readyFunction();

	}, false);

}

// Hide address bar on devices like the iPhone
//---------------------------------------------
function hideAddressBar(bPad) {
	// Big screen. Fixed chrome likely.
	if(screen.width > 980 || screen.height > 980) return;

	// Standalone (full screen webapp) mode
	if(window.navigator.standalone === true) return;

	// Page zoom or vertical scrollbars
	if(window.innerWidth !== document.documentElement.clientWidth) {
		// Sometimes one pixel too much. Compensate.
		if((window.innerWidth - 1) !== document.documentElement.clientWidth) return;

	}

	// Pad content if necessary.
	if(bPad === true && (document.documentElement.scrollHeight <= document.documentElement.clientHeight)) {
		// Extend body height to overflow and cause scrolling
		bodyTag = document.getElementsByTagName('body')[0];

		// Viewport height at fullscreen
		bodyTag.style.height = document.documentElement.clientWidth / screen.width * screen.height + 'px';

	}

	setTimeout(function() {
		// Already scrolled?
		if(window.pageYOffset !== 0) return;

		// Perform autoscroll
		window.scrollTo(0, 1);

		// Reset body height and scroll
		if(bodyTag !== undefined) bodyTag.style.height = window.innerHeight + 'px';
		window.scrollTo(0, 0);

	}, 1000);

}

// Quick address bar hide on devices like the iPhone
//---------------------------------------------------
function quickHideAddressBar() {
	setTimeout(function() {
		if(window.pageYOffset !== 0) return;
		window.scrollTo(0, window.pageYOffset + 1);

	}, 1000);

	
}
	function toggleReadonly() {
      const input = document.getElementById('myInput');
      input.readOnly = !input.readOnly;
      console.log('readonly:', input.readOnly);
    }
</script>/
